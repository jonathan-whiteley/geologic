[project]
name = "geologic"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8", "fastapi", "httpx"]
databricks = ["databricks-sdk>=0.40", "databricks-sql-connector>=3.4", "psycopg[binary]>=3.2", "mlflow>=3.1", "databricks-vectorsearch>=0.40"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
