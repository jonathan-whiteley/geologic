# Env lives in config.env (DAB apps pattern) and is applied by `databricks bundle run geologic`.
# Lakebase uses direct env vars, not the database binding (that binding needs a workspace-admin deployer).
# The Postgres role is the app's own DATABRICKS_CLIENT_ID (geologic.lakebase.lakebase_user).
# No env value may resolve to an empty string.
resources:
  apps:
    geologic:
      name: ${var.app_name}
      description: "GEOlogic: AI answer intelligence for Little Caesars"
      source_code_path: ../app
      config:
        command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
          - { name: DATABRICKS_WAREHOUSE_ID, value_from: sql-warehouse }
          - { name: CATALOG_NAME, value: "${var.catalog}" }
          - { name: SCHEMA_NAME, value: "${var.schema}" }
          - { name: GEOLOGIC_CATALOG, value: "${var.catalog}" }
          - { name: GEOLOGIC_SCHEMA, value: "${var.schema}" }
          - { name: GENIE_SPACE_ID, value: "${var.genie_space_id}" }
          - { name: PUBLISH_JOB_ID, value_from: publish-job }
          - { name: RESET_JOB_ID, value_from: reset-job }
          - { name: PRODUCE_JOB_ID, value_from: produce-job }
          - { name: LAKEBASE_INSTANCE, value: geologic }
          - { name: LAKEBASE_DB, value: "${var.lakebase_db}" }
          - { name: LAKEBASE_HOST, value: "${var.lakebase_host}" }
          - { name: GEOLOGIC_MATCH_THRESHOLD, value: "0.80" }
      resources:
        - name: sql-warehouse
          sql_warehouse: { id: "${var.warehouse_id}", permission: CAN_USE }
        - name: publish-job
          job: { id: "${resources.jobs.geologic_publish.id}", permission: CAN_MANAGE_RUN }
        - name: reset-job
          job: { id: "${resources.jobs.geologic_reset.id}", permission: CAN_MANAGE_RUN }
        - name: produce-job
          job: { id: "${resources.jobs.geologic_produce.id}", permission: CAN_MANAGE_RUN }
        # The fast path (approve, re-ask, search, track) calls these from the app process.
        - name: engine-claude
          serving_endpoint: { name: databricks-claude-sonnet-5-5, permission: CAN_QUERY }
        - name: engine-chatgpt
          serving_endpoint: { name: databricks-gpt-5-5, permission: CAN_QUERY }
        - name: engine-gemini
          serving_endpoint: { name: databricks-gemini-3-8-flash, permission: CAN_QUERY }
        - name: engine-meta-ai
          serving_endpoint: { name: databricks-llama-4-maverick, permission: CAN_QUERY }
        - name: judge
          serving_endpoint: { name: databricks-claude-sonnet-4-6, permission: CAN_QUERY }
        - name: embeddings
          serving_endpoint: { name: databricks-gte-large-en, permission: CAN_QUERY }
