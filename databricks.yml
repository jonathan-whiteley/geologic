bundle:
  name: geologic

include:
  - resources/*.yml

variables:
  catalog:
    default: jdub_demo
  schema:
    default: geologic
  warehouse_id:
    description: SQL warehouse for the app and dashboard
    default: 0168e23e24e6ae10
  lakebase_host:
    description: Lakebase read_write_dns for instance geologic
    default: ep-withered-butterfly-d1czv7t3.database.us-west-2.cloud.databricks.com
  genie_space_id:
    description: GEOlogic Genie space (Ask Genie panel); "none" means not configured
    default: 01f1c1ad57691e9ab2457acf2bff7d78
  app_name:
    description: Databricks App name
    default: geologic
  name_prefix:
    description: Job name prefix (jobs are named <name_prefix>_<job>)
    default: geologic
  pipeline_name:
    description: Signals pipeline name
    default: geologic-signals
  lakebase_db:
    description: Lakebase database on instance geologic (app env and job --lakebase-db)
    default: geologic

# No `mode: development`: development mode prefixes job and pipeline names, which would
# rename the adopted live resources. Names come from the variables above, set per target.
targets:
  # The live v2 demo. scripts/deploy.sh refuses this target unless ALLOW_V2_DEPLOY=1 (v2 branch only).
  dev:
    workspace:
      profile: DEFAULT
    resources:
      dashboards:
        geologic_impact:
          display_name: GEOlogic Impact
          file_path: ./dashboards/geologic_impact.lvdash.json
          warehouse_id: ${var.warehouse_id}
          # Keep the live parent folder; moving a dashboard can force a replace.
          parent_path: /Users/jonathan.whiteley@databricks.com/genie_spaces
  # GEOlogic v3: its own state, schema, app, jobs, pipeline and Lakebase database. Default target on build/v3.
  v3:
    default: true
    workspace:
      profile: DEFAULT
    variables:
      schema: geologic_v3
      app_name: geologic-v3
      name_prefix: geologic_v3
      pipeline_name: geologic-v3-signals
      lakebase_db: geologic_v3
      genie_space_id: none

sync:
  # app/src and app/frontend/dist are gitignored build outputs; include them so the
  # app source path carries the bundled package and the built frontend.
  include:
    - app/src/**
    - app/frontend/dist/**
  exclude:
    - .venv/**
    - mockups/**
    - tests/**
    - uv.lock
    - "**/__pycache__/**"
    - "**/*.egg-info/**"
    # Frontend sources must not reach the app path: package.json triggers an npm build
    # that times out the app start. Only frontend/dist ships.
    - app/frontend/node_modules/**
    - app/frontend/src/**
    - app/frontend/public/**
    - app/frontend/index.html
    - app/frontend/package.json
    - app/frontend/package-lock.json
    - app/frontend/postcss.config.js
    - app/frontend/tailwind.config.js
    - app/frontend/tsconfig.json
    - app/frontend/tsconfig.node.json
    - app/frontend/vite.config.ts
